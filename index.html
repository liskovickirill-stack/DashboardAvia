<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дашборд эффективности</title>
<style>
  :root {
    --bg: #0f1117;
    --bg2: #161a23;
    --card: #1b202b;
    --card2: #202634;
    --text: #e8ecf4;
    --muted: #8b93a7;
    --green: #34d399;
    --red: #f87171;
    --blue: #60a5fa;
    --violet: #a78bfa;
    --amber: #fbbf24;
    --border: #2a3140;
    --shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: radial-gradient(1200px 600px at 80% -10%, #1c2333 0%, var(--bg) 55%);
    color: var(--text);
    padding: 28px;
    min-height: 100vh;
  }
  .container { max-width: 1200px; margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 26px;
  }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; }
  h1 .accent { color: var(--blue); }
  .updated { color: var(--muted); font-size: 13px; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 16px;
    margin-bottom: 30px;
  }
  .card {
    background: linear-gradient(180deg, var(--card2), var(--card));
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .card .label { font-size: 13px; color: var(--muted); margin-bottom: 10px; letter-spacing: 0.02em; }
  .card .value { font-size: 36px; font-weight: 800; line-height: 1.05; letter-spacing: -0.02em; }
  .card .sub { font-size: 13px; margin-top: 8px; color: var(--muted); }
  .card .diff { font-weight: 600; }
  .ok { color: var(--green); }
  .bad { color: var(--red); }
  .bar {
    height: 8px;
    background: #2a3140;
    border-radius: 6px;
    margin-top: 14px;
    overflow: hidden;
  }
  .bar > div { height: 100%; border-radius: 6px; }
  .bar .ok { background: linear-gradient(90deg, #10b981, #34d399); }
  .bar .bad { background: linear-gradient(90deg, #ef4444, #f87171); }
  .quality {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 14px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
  }
  .quality b { font-size: 16px; }

  .groups {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    align-items: start;
  }
  .group {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    box-shadow: var(--shadow);
  }
  .group.lena { border-top: 3px solid var(--blue); }
  .group.liza { border-top: 3px solid var(--violet); }
  .group-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    user-select: none;
  }
  .group-title { font-size: 18px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .group-title .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; }
  .group.lena .dot { background: var(--blue); }
  .group.liza .dot { background: var(--violet); }
  .chevron { display: inline-block; transition: transform .2s; color: var(--muted); font-size: 14px; }
  details:not([open]) > summary .chevron { transform: rotate(-90deg); }
  .group-rate { font-size: 15px; font-weight: 700; }
  .group-rate .ok { color: var(--green); }
  .group-rate .bad { color: var(--red); }
  .group-quality { font-size: 12px; color: var(--muted); margin-top: 4px; }

  .emp-list { margin-top: 16px; }
  .emp {
    background: var(--card2);
    border-radius: 12px;
    margin-bottom: 10px;
    overflow: hidden;
  }
  .emp:last-child { margin-bottom: 0; }
  .emp-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 14px;
    cursor: pointer;
    user-select: none;
  }
  .emp .name { font-size: 14px; font-weight: 600; }
  .emp .meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .emp .rate { font-size: 18px; font-weight: 800; }
  .emp .rate .ok { color: var(--green); }
  .emp .rate .bad { color: var(--red); }
  .emp .mini-bar {
    height: 5px; background: #2a3140; border-radius: 4px; margin-top: 6px; overflow: hidden;
  }
  .emp .mini-bar > div { height: 100%; border-radius: 4px; }
  .emp .mini-bar .ok { background: var(--green); }
  .emp .mini-bar .bad { background: var(--red); }

  .emp-detail {
    padding: 4px 14px 14px;
    border-top: 1px solid var(--border);
  }
  .d-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    font-size: 13px;
    color: var(--muted);
  }
  .d-row + .d-row { border-top: 1px dashed var(--border); }
  .d-row b { font-size: 14px; }

  .loading, .error {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 16px;
  }
  .error { color: var(--red); }
  .note { font-size: 12px; color: var(--muted); margin-top: 24px; text-align: center; }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .tab-btn {
    background: var(--card2);
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all .15s;
  }
  .tab-btn:hover { color: var(--text); border-color: #3a4356; }
  .tab-btn.active { background: var(--blue); color: #0b1220; border-color: var(--blue); }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
  .chart-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .chart-card h3 { font-size: 16px; margin-bottom: 16px; }
  .chart-wrap { position: relative; height: 340px; }

  .period-controls { display: flex; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .period-controls label { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 8px; }
  .period-controls input[type=date] {
    background: var(--card2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px;
  }
  .header-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .month-controls { display: flex; align-items: center; gap: 8px; }
  .month-controls .m-label { font-size: 13px; color: var(--muted); }
  #month-select {
    background: var(--card2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; cursor: pointer;
  }
  #month-select:hover { border-color: #3a4356; }

  @media (max-width: 800px) {
    .groups { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>📊 Дашборд <span class="accent">эффективности</span></h1>
    <div class="header-right">
      <div class="month-controls">
        <span class="m-label">Месяц:</span>
        <select id="month-select"></select>
      </div>
      <div class="updated" id="updated">Загрузка данных…</div>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="overview" onclick="showTab('overview')">📊 Обзор</button>
    <button class="tab-btn" data-tab="charts" onclick="showTab('charts')">📈 Графики</button>
  </div>

  <div id="content">
    <div id="tab-overview" class="tab-panel active">
      <div class="loading">Загружаю данные из таблицы…</div>
    </div>
    <div id="tab-charts" class="tab-panel">
      <div class="chart-card">
        <h3>Эффективность по дням</h3>
        <div class="period-controls">
          <label>От <input type="date" id="eff-from"></label>
          <label>До <input type="date" id="eff-to"></label>
        </div>
        <div class="chart-wrap"><canvas id="chart-eff"></canvas></div>
      </div>
      <div class="chart-card">
        <h3>Качество по дням</h3>
        <div class="period-controls">
          <label>От <input type="date" id="q-from"></label>
          <label>До <input type="date" id="q-to"></label>
        </div>
        <div class="chart-wrap"><canvas id="chart-quality"></canvas></div>
      </div>
    </div>
  </div>

  <div class="note">Данные обновляются автоматически из Google-таблицы при каждом открытии страницы.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
const SHEET_MAIN = 'https://docs.google.com/spreadsheets/d/1z9hISAx0GcUIxalb_ULRavkvlwphtSCtKosu93RYUJY/gviz/tq?tqx=out:json&gid=557967994';
const SHEET_ZHALOBY = 'https://docs.google.com/spreadsheets/d/1z9hISAx0GcUIxalb_ULRavkvlwphtSCtKosu93RYUJY/gviz/tq?tqx=out:json&gid=1159078706';
const SHEET_LOG = 'https://docs.google.com/spreadsheets/d/1z9hISAx0GcUIxalb_ULRavkvlwphtSCtKosu93RYUJY/gviz/tq?tqx=out:json&gid=328224535';
const SHEET_BASE = 'https://docs.google.com/spreadsheets/d/1z9hISAx0GcUIxalb_ULRavkvlwphtSCtKosu93RYUJY/gviz/tq?tqx=out:json&sheet=';
function monthKey(d) {
  return String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getFullYear()).slice(2);
}
function reportUrlFor(key) {
  return SHEET_BASE + encodeURIComponent('отчет ' + key);
}
function logUrlFor(key) {
  return SHEET_BASE + encodeURIComponent('Лог анкет ' + key);
}
function zhalobyUrlFor(key) {
  return SHEET_BASE + encodeURIComponent('жалобы и залеты ' + key);
}
function populateMonths(select) {
  const now = new Date();
  const opts = [];
  for (let i = 0; i < 6; i++) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    const key = monthKey(d);
    const label = d.toLocaleString('ru-RU', { month: 'long', year: 'numeric' });
    opts.push({ key, label });
  }
  select.innerHTML = opts.map(o => `<option value="${o.key}">${o.label}</option>`).join('');
  select.value = monthKey(now);
}

const RATE_TARGET = 4;
const QUALITY_TARGET = 0.85;
const EMP_TARGETS = {
  'Юлия': 3, 'Ксения': 3, 'Николай': 3, 'Арина': 3, 'Александр': 3, 'Вероника': 3, 'Валерий': 3
};

function num(v) {
  return (typeof v === 'number') ? v : null;
}

function fmt(n, digits) {
  if (n == null) return '—';
  return n.toLocaleString('ru-RU', { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function pct(n) {
  if (n == null) return '—';
  return (n * 100).toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 0 }) + '%';
}

function pctQ(n) {
  if (n == null) return '—';
  return (n * 100).toLocaleString('ru-RU', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
}

function pct3(n) {
  if (n == null) return '—';
  return (n * 100).toLocaleString('ru-RU', { minimumFractionDigits: 3, maximumFractionDigits: 3 }) + '%';
}

function norm(s) {
  return String(s).toLowerCase().replace(/\./g, '').replace(/\s+/g, ' ').trim();
}

async function fetchRows(url) {
  const resp = await fetch(url);
  const text = await resp.text();
  const jsonStr = text.substring(text.indexOf('(') + 1, text.lastIndexOf(')'));
  const data = JSON.parse(jsonStr);
  return data.table.rows;
}

function parseMain(rows) {
  const employees = [];
  for (const r of rows) {
    const c = r.c;
    const fullName = c[0] && c[0].v;
    const group = c[4] && c[4].v;
    if (typeof fullName === 'string' && fullName && (group === 'Лиза' || group === 'Лена')) {
      const chats = num(c[6] && c[6].v);
      const hours = num(c[9] && c[9].v);
      const displayName = (c[3] && c[3].v) || fullName;
      employees.push({
        name: displayName,
        group,
        chats,
        hours,
        target: EMP_TARGETS[displayName] || RATE_TARGET,
        rate: (chats != null && hours) ? chats / hours : null
      });
    }
  }

  const summaryIdx = rows.findIndex(r => r.c[2] && r.c[2].v === 'Summary of teammates');
  const blocks = [];
  for (let i = summaryIdx + 1; i < rows.length; i++) {
    const c = rows[i].c;
    const label = c[4] && c[4].v;
    if (label === 'Обычная папка' || label === 'Запас/догнать') continue;
    const v6 = num(c[6] && c[6].v);
    const v7 = num(c[7] && c[7].v);
    if (v6 != null || v7 != null) blocks.push({ v6, v7 });
  }

  const deptChats = employees.reduce((s, e) => s + (e.chats || 0), 0);
  const deptHours = employees.reduce((s, e) => s + (e.hours || 0), 0);
  const dept = {
    current: deptHours ? deptChats / deptHours : null,
    target: RATE_TARGET,
    diff: deptHours ? (deptChats / deptHours - RATE_TARGET) / RATE_TARGET : null
  };
  const siren = { chats: blocks[3].v6, hours: blocks[3].v7, current: blocks[4].v7, target: blocks[5].v7, diff: blocks[6].v7 };
  const g1 = { chats: blocks[7].v6, hours: blocks[7].v7, current: blocks[8].v7, target: blocks[9].v7, diff: blocks[10].v7 };
  const g2 = { chats: blocks[11].v6, hours: blocks[11].v7, current: blocks[12].v7, target: blocks[13].v7, diff: blocks[14].v7 };

  const lizaSum = employees.filter(e => e.group === 'Лиза').reduce((s, e) => s + (e.chats || 0), 0);
  const lenaSum = employees.filter(e => e.group === 'Лена').reduce((s, e) => s + (e.chats || 0), 0);
  const liza = Math.abs(g1.chats - lizaSum) < Math.abs(g2.chats - lizaSum) ? g1 : g2;
  const lena = liza === g1 ? g2 : g1;

  return { employees, dept, siren, liza, lena };
}

function nameKeyFromFull(full) {
  const parts = String(full).trim().split(/\s+/);
  const name = parts[1] || parts[0] || '';
  const patr = parts[2];
  if (patr) return norm(name + ' ' + patr[0]);
  return norm(name);
}

function parseLog(rows) {
  const byFull = {};
  const byName = {};
  const daily = [];
  for (const r of rows) {
    const c = r.c;
    const fullName = c[26] && c[26].v;
    const score = num(c[9] && c[9].v);
    if (typeof fullName === 'string' && fullName.trim() && score != null) {
      const parts = fullName.trim().split(/\s+/);
      const name = parts[1] || parts[0];
      const fullKey = nameKeyFromFull(fullName);
      const nameKey = norm(name);
      (byFull[fullKey] = byFull[fullKey] || []).push(score);
      (byName[nameKey] = byName[nameKey] || []).push(score);
      const dateCell = c[4] && c[4].f;
      if (dateCell && /^\d{2}\.\d{2}\.\d{4}$/.test(dateCell)) {
        daily.push({ day: dateCell.slice(0, 5), name, score });
      }
    }
  }
  return { byFull, byName, daily };
}

function qualityStats(emp, log) {
  // Сначала точный ключ (имя + инициал), чтобы разделить однофамильцев (Никита Р. / Никита М.)
  let arr = log.byFull[norm(emp.name)];
  if (!arr || !arr.length) {
    const parts = String(emp.name).trim().split(/\s+/);
    for (const p of parts) {
      const k = norm(p);
      if (log.byName[k] && log.byName[k].length) { arr = log.byName[k]; break; }
    }
  }
  if (!arr || !arr.length) return null;
  return { sum: arr.reduce((s, x) => s + x, 0), count: arr.length };
}

function getQuality(emp, log) {
  const st = qualityStats(emp, log);
  return st ? st.sum / st.count : null;
}

function parseZhaloby(rows) {
  const zhaloby = {};
  const zalety = {};
  const zhaloby3 = {};
  const zalety3 = {};
  for (const r of rows) {
    const c = r.c;
    const zName = c[0] && c[0].v;
    if (typeof zName === 'string' && zName.trim()) {
      const count = num(c[1] && c[1].v) || 0;
      const sum = num(c[2] && c[2].v) || 0;
      const key = norm(zName);
      const k3 = key.slice(0, 3);
      if (!zalety[key]) zalety[key] = { count: 0, sum: 0 };
      zalety[key].count += count; zalety[key].sum += sum;
      if (!zalety3[k3]) zalety3[k3] = { count: 0, sum: 0 };
      zalety3[k3].count += count; zalety3[k3].sum += sum;
    }
    const zhName = c[6] && c[6].v;
    if (typeof zhName === 'string' && zhName.trim()) {
      const count = num(c[7] && c[7].v) || 0;
      const key = norm(zhName);
      const k3 = key.slice(0, 3);
      zhaloby[key] = (zhaloby[key] || 0) + count;
      zhaloby3[k3] = (zhaloby3[k3] || 0) + count;
    }
  }
  return { zhaloby, zalety, zhaloby3, zalety3 };
}

function getZhalobyZalety(emp, z) {
  const nameKey = norm(emp.name.split(/\s+/)[0]);
  const k3 = nameKey.slice(0, 3);
  const zh = z.zhaloby[nameKey] ?? z.zhaloby3[k3] ?? 0;
  const zl = z.zalety[nameKey] ?? z.zalety3[k3] ?? { count: 0, sum: 0 };
  return { zhaloby: zh, zalety: zl };
}

function avgQuality(emps, log) {
  // Взвешенный расчёт: сумма всех оценок ÷ все анкеты (каждая анкета весит одинаково)
  let sum = 0, count = 0;
  for (const e of emps) {
    const st = qualityStats(e, log);
    if (st) { sum += st.sum; count += st.count; }
  }
  return count ? sum / count : null;
}

// Взвешенное качество + анкеты РГ (по ключам лога, напр. 'елена')
function weightedQuality(emps, log, extraKeys) {
  let sum = 0, count = 0;
  for (const e of emps) {
    const st = qualityStats(e, log);
    if (st) { sum += st.sum; count += st.count; }
  }
  for (const k of (extraKeys || [])) {
    const arr = log.byName[k] || log.byFull[k];
    if (arr && arr.length) { sum += arr.reduce((s, x) => s + x, 0); count += arr.length; }
  }
  return count ? sum / count : null;
}

function card(label, value, target, diff, quality, zhaloby, zhalobyPct, zaletyCount, zaletySum) {
  const ok = value != null && target != null && value >= target;
  const pctW = value != null && target ? Math.min(100, (value / target) * 100) : 0;
  const diffClass = diff != null && diff >= 0 ? 'ok' : 'bad';
  const qOk = quality != null && quality >= QUALITY_TARGET;
  const zhBlock = zhaloby != null
    ? `<div class="quality"><span>Жалобы</span><b class="${zhaloby > 0 ? 'bad' : 'ok'}">${zhaloby} · ${pct3(zhalobyPct)}</b></div>`
    : '';
  const zlBlock = zaletyCount != null
    ? `<div class="quality"><span>Залёты</span><b class="${zaletyCount > 0 ? 'bad' : 'ok'}">${zaletyCount} · ${fmt(zaletySum, 0)} ₽</b></div>`
    : '';
  return `
    <div class="card">
      <div class="label">${label}</div>
      <div class="value ${ok ? 'ok' : 'bad'}">${fmt(value, 2)}</div>
      <div class="sub">Цель: ${fmt(target, 0)}</div>
      <div class="sub diff ${diffClass}">${diff != null ? (diff >= 0 ? '▲' : '▼') + ' ' + pct(diff) : '—'}</div>
      <div class="bar"><div class="${ok ? 'ok' : 'bad'}" style="width:${pctW}%"></div></div>
      <div class="quality"><span>Качество</span> <b class="${qOk ? 'ok' : 'bad'}">${pctQ(quality)}</b></div>
      ${zhBlock}
      ${zlBlock}
    </div>`;
}

function empCard(e) {
  const t = e.target || RATE_TARGET;
  const ok = e.rate != null && e.rate >= t;
  const pctW = e.rate != null ? Math.min(100, (e.rate / t) * 100) : 0;
  const qOk = e.quality != null && e.quality >= QUALITY_TARGET;
  const zhOk = e.zhaloby == null || e.zhaloby <= 0;
  const zlOk = e.zalety == null || e.zalety.count <= 0;
  const zlCount = e.zalety ? e.zalety.count : 0;
  const zlSum = e.zalety ? e.zalety.sum : 0;
  return `
    <details class="emp">
      <summary class="emp-head">
        <div>
          <div class="name"><span class="chevron">▸</span> ${e.name}</div>
          <div class="meta">${fmt(e.chats, 0)} чатов · ${fmt(e.hours, 1)} ч</div>
          <div class="mini-bar"><div class="${ok ? 'ok' : 'bad'}" style="width:${pctW}%"></div></div>
        </div>
        <div class="rate ${ok ? 'ok' : 'bad'}">${fmt(e.rate, 2)}</div>
      </summary>
      <div class="emp-detail">
        <div class="d-row"><span>Эффективность</span><b class="${ok ? 'ok' : 'bad'}">${fmt(e.rate, 2)} / ${t}</b></div>
        <div class="d-row"><span>Качество</span><b class="${qOk ? 'ok' : 'bad'}">${pctQ(e.quality)} / 85%</b></div>
        <div class="d-row"><span>Жалобы</span><b class="${zhOk ? 'ok' : 'bad'}">${e.zhaloby ?? 0}</b></div>
        <div class="d-row"><span>Залёты</span><b class="${zlOk ? 'ok' : 'bad'}">${zlCount} · ${fmt(zlSum, 0)} ₽</b></div>
      </div>
    </details>`;
}

function groupBlock(title, cls, group, rate, quality, zhaloby, zhalobyPct, zaletyCount, zaletySum) {
  const ok = rate != null && rate >= RATE_TARGET;
  const sorted = group.slice().sort((a, b) => (b.rate ?? -1) - (a.rate ?? -1));
  const zhLine = zhaloby != null
    ? `<div class="group-quality">Жалобы: <span class="${zhaloby > 0 ? 'bad' : 'ok'}">${zhaloby} · ${pct3(zhalobyPct)}</span></div>`
    : '';
  const zlLine = zaletyCount != null
    ? `<div class="group-quality">Залёты: <span class="${zaletyCount > 0 ? 'bad' : 'ok'}">${zaletyCount} · ${fmt(zaletySum, 0)} ₽</span></div>`
    : '';
  return `
    <div class="group ${cls}">
      <details class="group-details" open>
        <summary class="group-head">
          <div class="group-title"><span class="chevron">▸</span><span class="dot"></span>${title}</div>
          <div>
            <div class="group-rate ${ok ? 'ok' : 'bad'}">${fmt(rate, 2)}</div>
            <div class="group-quality">Качество: <span class="${quality != null && quality >= QUALITY_TARGET ? 'ok' : 'bad'}">${pctQ(quality)}</span></div>
            ${zhLine}
            ${zlLine}
          </div>
        </summary>
        <div class="emp-list">
          ${sorted.map(empCard).join('')}
        </div>
      </details>
    </div>`;
}

function render(data) {
  const { employees, dept, siren, liza, lena } = data;

  const cards = `
    <div class="cards">
      ${card('Отдел — чатов в час', dept.current, dept.target, dept.diff, dept.quality, dept.zhaloby, dept.zhalobyPct, dept.zaletyCount, dept.zaletySum)}
      ${card('Группа Лизы — чатов в час', liza.current, liza.target, liza.diff, liza.quality, liza.zhaloby, liza.zhalobyPct, liza.zaletyCount, liza.zaletySum)}
      ${card('Группа Лены — чатов в час', lena.current, lena.target, lena.diff, lena.quality, lena.zhaloby, lena.zhalobyPct, lena.zaletyCount, lena.zaletySum)}
      ${card('Обучение Сирена — чатов в час', siren.current, siren.target, siren.diff, siren.quality, null, null, null, null)}
    </div>`;

  const lenaEmp = employees.filter(e => e.group === 'Лена');
  const lizaEmp = employees.filter(e => e.group === 'Лиза');

  const groups = `
    <div class="groups">
      ${groupBlock('Группа Лены', 'lena', lenaEmp, lena.current, lena.quality, lena.zhaloby, lena.zhalobyPct, lena.zaletyCount, lena.zaletySum)}
      ${groupBlock('Группа Лизы', 'liza', lizaEmp, liza.current, liza.quality, liza.zhaloby, liza.zhalobyPct, liza.zaletyCount, liza.zaletySum)}
    </div>`;

  document.getElementById('tab-overview').innerHTML = cards + groups;
  document.getElementById('updated').textContent = 'Обновлено: ' + new Date().toLocaleString('ru-RU');
}

function showTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'tab-' + name));
  if (name === 'charts' && !window._chartsRendered) {
    window._chartsRendered = true;
    renderCharts(window._report);
  }
}

function parseReport(rows) {
  const header = rows[0].c;
  const days = [];
  for (let i = 0; i < header.length; i++) {
    const d = header[i] && (header[i].f || header[i].v);
    if (d && /^\d{2}\.\d{2}$/.test(d)) days.push({ idx: i, label: d });
  }
  const byEmp = {};
  for (const r of rows) {
    const c = r.c;
    const fullName = c[0] && c[0].v;
    if (typeof fullName !== 'string' || !fullName) continue;
    if (c[2] && c[2].v === 'Summary of teammates') continue;
    let group = c[4] && c[4].v;
    let displayName = c[3] && c[3].v;
    let chats, hours, rate;
    if (group === 'Лиза' || group === 'Лена') {
      // формат 08.26: группа в c[4], имя в c[3]
      chats = num(c[6] && c[6].v);
      hours = num(c[9] && c[9].v);
      rate = num(c[12] && c[12].v);
    } else {
      // формат 06.26/07.26: руководитель в c[3], имя в c[1]
      const rg = c[3] && c[3].v;
      group = rg === 'Сивакина Елена' ? 'Лена' : rg === 'Елизавета Белова' ? 'Лиза' : null;
      displayName = c[1] && c[1].v;
      chats = num(c[5] && c[5].v);
      hours = num(c[8] && c[8].v);
      rate = num(c[11] && c[11].v);
    }
    if (!group) continue;
    const vals = days.map(d => num(c[d.idx] && c[d.idx].v) || 0);
    byEmp[displayName] = { name: displayName, group, chats, hours, rate, vals };
  }
  const emps = Object.values(byEmp);
  const mk = (arr) => {
    const chats = arr.reduce((s, e) => s + (e.chats || 0), 0);
    const hours = arr.reduce((s, e) => s + (e.hours || 0), 0);
    const current = hours ? chats / hours : null;
    const target = RATE_TARGET;
    const diff = current != null ? (current - target) / target : null;
    return { chats, hours, current, target, diff };
  };
  const dept = mk(emps);
  const lena = mk(emps.filter(e => e.group === 'Лена'));
  const liza = mk(emps.filter(e => e.group === 'Лиза'));
  const siren = extractSiren(rows);
  return { days, byEmp, dept, lena, liza, siren };
}

function extractSiren(rows) {
  const summaryIdx = rows.findIndex(r => r.c[2] && r.c[2].v === 'Summary of teammates');
  if (summaryIdx < 0) return { current: null, target: 3, diff: null };
  for (let i = summaryIdx + 1; i < rows.length; i++) {
    const c = rows[i].c;
    // цель 3 в c[7] (формат 08.26) или c[6] (формат 07.26)
    const t7 = num(c[7] && c[7].v);
    const t6 = num(c[6] && c[6].v);
    if (t7 === 3) {
      // формат 08.26: текущее в c[7] предыдущей строки, чаты/часы в строке перед ней
      const curRow = rows[i - 1] && rows[i - 1].c;
      const dataRow = rows[i - 2] && rows[i - 2].c;
      const current = num(curRow && curRow[7] && curRow[7].v);
      const diff = num(c[8] && c[8].v);
      const chats = num(dataRow && dataRow[6] && dataRow[6].v);
      const hours = num(dataRow && dataRow[7] && dataRow[7].v);
      return { chats, hours, current, target: 3, diff };
    } else if (t6 === 3) {
      // формат 07.26: текущее в c[6] предыдущей строки
      const curRow = rows[i - 1] && rows[i - 1].c;
      const dataRow = rows[i - 2] && rows[i - 2].c;
      const current = num(curRow && curRow[6] && curRow[6].v);
      const diff = num(c[7] && c[7].v);
      const chats = num(dataRow && dataRow[5] && dataRow[5].v);
      const hours = num(dataRow && dataRow[6] && dataRow[6].v);
      return { chats, hours, current, target: 3, diff };
    }
  }
  return { current: null, target: 3, diff: null };
}

function valToLabel(v) {
  if (!v) return null;
  const p = v.split('-');
  return p[2] + '.' + p[1];
}

function destroyCharts() {
  if (window._charts) Object.values(window._charts).forEach(c => { if (c) c.destroy(); });
  window._charts = {};
}

function renderCharts(report) {
  if (typeof Chart === 'undefined') return;
  destroyCharts();
  const { days, byEmp } = report;
  const labels = days.map(d => d.label);
  const emps = Object.values(byEmp);
  const lena = emps.filter(e => e.group === 'Лена');
  const liza = emps.filter(e => e.group === 'Лиза');
  const sum = (arr) => labels.map((_, i) => arr.reduce((s, e) => s + (e.vals[i] || 0), 0));
  const dept = sum(emps);
  const lenaSum = sum(lena);
  const lizaSum = sum(liza);

  // Качество по дням из лога анкет
  const daily = (window._log && window._log.daily) || [];
  const groupByFirst = {};
  for (const e of emps) {
    const fw = String(e.name).split(/\s+/)[0];
    if (fw) groupByFirst[fw] = e.group;
  }
  const qByDay = { dept: {}, lena: {}, liza: {} };
  for (const d of daily) {
    const g = groupByFirst[d.name] || 'dept';
    const bucket = g === 'Лена' ? 'lena' : g === 'Лиза' ? 'liza' : 'dept';
    (qByDay.dept[d.day] = qByDay.dept[d.day] || []).push(d.score);
    if (bucket !== 'dept') (qByDay[bucket][d.day] = qByDay[bucket][d.day] || []).push(d.score);
  }
  const avgArr = (arr) => arr && arr.length ? arr.reduce((s, x) => s + x, 0) / arr.length * 100 : null;
  const qDept = labels.map(l => avgArr(qByDay.dept[l]));
  const qLena = labels.map(l => avgArr(qByDay.lena[l]));
  const qLiza = labels.map(l => avgArr(qByDay.liza[l]));

  const effFrom = valToLabel(document.getElementById('eff-from').value);
  const effTo = valToLabel(document.getElementById('eff-to').value);
  const qFrom = valToLabel(document.getElementById('q-from').value);
  const qTo = valToLabel(document.getElementById('q-to').value);

  const filter = (ls, arr, from, to) => {
    const out = { labels: [], data: [] };
    for (let i = 0; i < ls.length; i++) {
      if (from && ls[i] < from) continue;
      if (to && ls[i] > to) continue;
      out.labels.push(ls[i]);
      out.data.push(arr[i]);
    }
    return out;
  };

  const eff = filter(labels, dept, effFrom, effTo);
  const effLena = filter(labels, lenaSum, effFrom, effTo);
  const effLiza = filter(labels, lizaSum, effFrom, effTo);
  const q = filter(labels, qDept, qFrom, qTo);
  const qLenaF = filter(labels, qLena, qFrom, qTo);
  const qLizaF = filter(labels, qLiza, qFrom, qTo);

  window._charts['eff'] = new Chart(document.getElementById('chart-eff'), {
    type: 'line',
    data: {
      labels: eff.labels,
      datasets: [
        { label: 'Отдел', data: eff.data, borderColor: '#60a5fa', backgroundColor: 'rgba(96,165,250,0.1)', fill: true, tension: 0.3, pointRadius: 2 },
        { label: 'Группа Лены', data: effLena.data, borderColor: '#34d399', backgroundColor: 'rgba(52,211,153,0.1)', fill: true, tension: 0.3, pointRadius: 2 },
        { label: 'Группа Лизы', data: effLiza.data, borderColor: '#a78bfa', backgroundColor: 'rgba(167,139,250,0.1)', fill: true, tension: 0.3, pointRadius: 2 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#e8ecf4' } } },
      scales: {
        x: { ticks: { color: '#8b93a7' }, grid: { color: '#2a3140' } },
        y: { beginAtZero: true, ticks: { color: '#8b93a7' }, grid: { color: '#2a3140' } }
      }
    }
  });

  window._charts['quality'] = new Chart(document.getElementById('chart-quality'), {
    type: 'line',
    data: {
      labels: q.labels,
      datasets: [
        { label: 'Отдел', data: q.data, borderColor: '#60a5fa', backgroundColor: 'rgba(96,165,250,0.1)', fill: true, tension: 0.3, pointRadius: 2 },
        { label: 'Группа Лены', data: qLenaF.data, borderColor: '#34d399', backgroundColor: 'rgba(52,211,153,0.1)', fill: true, tension: 0.3, pointRadius: 2 },
        { label: 'Группа Лизы', data: qLizaF.data, borderColor: '#a78bfa', backgroundColor: 'rgba(167,139,250,0.1)', fill: true, tension: 0.3, pointRadius: 2 }
      ]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      plugins: { legend: { labels: { color: '#e8ecf4' } } },
      scales: {
        x: { ticks: { color: '#8b93a7' }, grid: { color: '#2a3140' } },
        y: { min: 0, max: 100, ticks: { color: '#8b93a7', callback: v => v + '%' }, grid: { color: '#2a3140' } }
      }
    }
  });
}

function buildData(report, log, z) {
  const employees = Object.values(report.byEmp).map(e => {
    const emp = { ...e, target: EMP_TARGETS[e.name] || RATE_TARGET };
    emp.quality = getQuality(emp, log);
    const zz = getZhalobyZalety(emp, z);
    emp.zhaloby = zz.zhaloby;
    emp.zalety = zz.zalety;
    return emp;
  });
  const addZhaloby = (grp) => {
    const arr = grp === 'dept' ? employees : employees.filter(e => e.group === grp);
    const zhaloby = arr.reduce((s, e) => s + (e.zhaloby || 0), 0);
    const chats = arr.reduce((s, e) => s + (e.chats || 0), 0);
    const zaletyCount = arr.reduce((s, e) => s + ((e.zalety && e.zalety.count) || 0), 0);
    const zaletySum = arr.reduce((s, e) => s + ((e.zalety && e.zalety.sum) || 0), 0);
    return { zhaloby, zhalobyPct: chats ? zhaloby / chats : null, zaletyCount, zaletySum };
  };
  // Качество отдела: все анкеты сотрудников + анкеты РГ (Сивакина Елена = 'елена' в логе)
  const deptQ = weightedQuality(employees, log, ['елена']);
  const dept = { ...report.dept, quality: deptQ, ...addZhaloby('dept') };
  const lena = { ...report.lena, quality: avgQuality(employees.filter(e => e.group === 'Лена'), log), ...addZhaloby('Лена') };
  const liza = { ...report.liza, quality: avgQuality(employees.filter(e => e.group === 'Лиза'), log), ...addZhaloby('Лиза') };
  const siren = { ...report.siren, quality: dept.quality };
  return { employees, dept, lena, liza, siren };
}

async function loadMonth(key) {
  let report, log, z;
  try {
    const [rr, lr, zr] = await Promise.all([
      fetchRows(reportUrlFor(key)),
      fetchRows(logUrlFor(key)),
      fetchRows(zhalobyUrlFor(key))
    ]);
    report = parseReport(rr);
    log = parseLog(lr);
    z = parseZhaloby(zr);
  } catch (e) {
    report = { days: [], byEmp: {}, dept: { current: null, target: RATE_TARGET, diff: null }, lena: { current: null, target: RATE_TARGET, diff: null }, liza: { current: null, target: RATE_TARGET, diff: null }, siren: { current: null, target: 3, diff: null } };
    log = { byFull: {}, byName: {}, daily: [] };
    z = { zhaloby: {}, zalety: {}, zhaloby3: {}, zalety3: {} };
  }
  const data = buildData(report, log, z);
  window._report = report;
  window._log = log;
  window._data = data;
  render(data);
  if (window._chartsRendered) renderCharts(report);
}

async function init() {
  try {
    const select = document.getElementById('month-select');
    populateMonths(select);
    select.addEventListener('change', () => loadMonth(select.value));
    ['eff-from', 'eff-to', 'q-from', 'q-to'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => {
        if (window._chartsRendered) renderCharts(window._report);
      });
    });
    await loadMonth(select.value);
  } catch (e) {
    document.getElementById('tab-overview').innerHTML =
      '<div class="error">Не удалось загрузить данные. Проверьте, что таблица открыта для доступа по ссылке.</div>';
    document.getElementById('updated').textContent = 'Ошибка загрузки';
  }
}

init();
</script>
